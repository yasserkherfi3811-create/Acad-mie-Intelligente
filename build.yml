name: Build Mobile and Desktop Apps

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        if [ -f package.json ]; then npm install; fi

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK with Capacitor
      run: |
        npx cap init --web-dir src AcademieIntelligente com.academy.app --yes || true
        npx cap add android || true
        npx cap sync android || true
        cd android
        chmod +x gradlew || true
        ./gradlew assembleDebug || true

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Build Windows EXE / App Files
      run: |
        npm run build-win || npx electron-builder --win --dir || true

    - name: Upload All Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: final-app-releases
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          dist/
          release/
